[build]
  # Directory to change to before starting a build
  base = "frontend"
  
  # Build command for Next.js
  command = "npm run build"

[build.environment]
  # Set Node version for compatibility
  NODE_VERSION = "18"

# Enable Next.js runtime for Netlify
[build.processing]
  skip_processing = false

# Handle client-side routing for Next.js App Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: Handle API routes if you add serverless functions later
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[dev]
  # Local development settings
  command = "npm run dev"
  port = 3000
